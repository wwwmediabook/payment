name: Build Android APK
# Works in 2 ways:
#  A) project files are in the repo root (project.godot visible), or
#  B) you uploaded only the .zip file to the repo root -> this workflow unzips it automatically.
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Find project (unzip if needed)
        run: |
          set -e
          if [ -f project.godot ]; then
            P=.
          else
            Z=$(ls ./*.zip 2>/dev/null | head -n 1 || true)
            if [ -z "$Z" ]; then echo "::error::No project.godot and no .zip file in the repo root"; exit 1; fi
            command -v unzip >/dev/null || (apt-get update -qq && apt-get install -y -qq unzip)
            mkdir -p _unzipped
            unzip -o -q "$Z" -d _unzipped
            F=$(find _unzipped -name project.godot -not -path '*/.godot/*' | head -n 1)
            if [ -z "$F" ]; then echo "::error::project.godot not found inside the zip"; exit 1; fi
            P=$(dirname "$F")
          fi
          echo "Project dir: $P"
          echo "PROJECT_DIR=$P" >> "$GITHUB_ENV"
      - name: Setup Godot + Android signing
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/ ~/.config/godot/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable || true
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mv debug.keystore /root/debug.keystore
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "/usr/lib/android-sdk"\nexport/android/debug_keystore = "/root/debug.keystore"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\nexport/android/force_system_user = false\nexport/android/shutdown_adb_on_exit = true\n' > ~/.config/godot/editor_settings-4.3.tres
          cp ~/.config/godot/editor_settings-4.3.tres ~/.config/godot/editor_settings-4.tres
      - name: Import assets (glb, wav)
        run: |
          cd "$PROJECT_DIR"
          godot --headless --import || true
      - name: Export APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build"
          cd "$PROJECT_DIR"
          godot --headless --verbose --export-debug "Android" "$GITHUB_WORKSPACE/build/dinajpur-jhenaidah.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/*.apk
      - name: Publish APK as a Release (easy download on phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: APK build ${{ github.run_number }}
          files: build/dinajpur-jhenaidah.apk
