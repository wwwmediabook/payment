name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  export-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/ ~/.config/godot/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable || true
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mv debug.keystore /root/debug.keystore
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "/usr/lib/android-sdk"\nexport/android/debug_keystore = "/root/debug.keystore"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\nexport/android/force_system_user = false\nexport/android/shutdown_adb_on_exit = true\n' > ~/.config/godot/editor_settings-4.3.tres
          cp ~/.config/godot/editor_settings-4.3.tres ~/.config/godot/editor_settings-4.tres
      - name: Import assets
        run: godot --headless --import || true
      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --verbose --export-debug "Android" build/dinajpur-jhenaidah.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/*.apk
